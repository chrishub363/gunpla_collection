services:
  - type: web
    name: gunpla-collection
    runtime: ruby
    # Deploys are triggered by GitHub Actions after CI passes on main
    # (.github/workflows/deploy.yml), not automatically on push.
    autoDeploy: false
    buildCommand: "./bin/render-build.sh"
    startCommand: "bundle exec rails server -p $PORT"
    envVars:
      - key: RAILS_ENV
        value: production
      - key: RAILS_LOG_LEVEL
        value: info
      - key: RAILS_MASTER_KEY
        sync: false
