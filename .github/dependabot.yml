version: 2
updates:
  # Ruby gems
  - package-ecosystem: bundler
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      # Batch routine minor/patch bumps into one weekly PR to cut noise.
      # Major bumps still open individually so they get a closer look.
      ruby-minor-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch

  # GitHub Actions pinned in .github/workflows
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      actions-minor-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch
